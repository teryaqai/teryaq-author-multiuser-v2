services:
  - type: web
    name: teryaq-author
    runtime: static
    buildCommand: >-
      node -e "const fs=require('fs'); const c={projectUrl:process.env.TERYAQ_SUPABASE_URL||'',anonKey:process.env.TERYAQ_SUPABASE_ANON_KEY||''}; fs.writeFileSync('runtime-config.js','window.__TERYAQ_CLOUD_CONFIG__='+JSON.stringify(c)+';'); if(!c.projectUrl||!c.anonKey) console.warn('TERYAQ cloud environment is incomplete');"
    staticPublishPath: .
    envVars:
      - key: TERYAQ_SUPABASE_URL
        sync: false
      - key: TERYAQ_SUPABASE_ANON_KEY
        sync: false

    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-brnspVHqQaWvXlheEjgkfnEDtucw7wypZwaNXo+zOLc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
